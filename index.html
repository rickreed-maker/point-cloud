<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotating 3D Point Cloud</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d18;color:#e9f1ff;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas:active{cursor:grabbing}.panel{position:fixed;top:16px;left:16px;width:min(300px,calc(100vw - 32px));padding:17px 18px;background:#111c30e8;border:1px solid #34445c;border-radius:14px;backdrop-filter:blur(12px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;transition:opacity .2s ease,transform .2s ease;z-index:2}.panel.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}h1{font-size:17px;margin:0 0 5px}.sub{color:#9cb1cb;font-size:12px;margin-bottom:16px}.control{display:flex;justify-content:space-between;align-items:center;margin:13px 0 5px}.value{color:#8fe7ff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#65cfff}button{border:1px solid #4b6781;background:#1c344a;color:white;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{background:#284d67}.buttons{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.status{font-size:12px;color:#8fe7ff;margin-top:10px;min-height:16px}button:disabled{opacity:.55;cursor:wait}select{max-width:175px;background:#1c344a;color:#fff;border:1px solid #4b6781;border-radius:7px;padding:7px;font:inherit}input[type=number]{width:85px;background:#1c344a;color:#fff;border:1px solid #4b6781;border-radius:7px;padding:7px;font:inherit}.preset-name{width:100%;background:#1c344a;color:#fff;border:1px solid #4b6781;border-radius:7px;padding:9px;font:inherit}.preset-section{margin:16px 0;padding:12px;border:1px solid #34445c;border-radius:10px}.preset-section h2{font-size:14px;margin:0 0 8px}.preset-section select{width:100%;max-width:none}.preset-section .buttons{margin-top:9px}.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#9cb1cb;font-size:12px;pointer-events:none}@media(max-width:520px){.panel{top:10px;left:10px;width:245px;padding:12px}.hint{font-size:11px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="panel" id="panel"><h1>3D Point Cloud</h1><div class="sub">Perspective projection · Y-axis rotation</div>
<div class="control"><label for="structure">Point structure</label><select id="structure"><option value="sphere">Ball</option><option value="shell">Sphere</option><option value="attraction" selected>Attraction Sphere</option><option value="grid">Grid (XZ plane)</option></select></div>
<details id="attractionPanel" open hidden><summary>Sphere physics</summary><div class="control"><label>Nodes</label><input id="nodes" type="number" min="2" max="800" value="12"></div><div class="buttons"><button id="minusNode">−</button><button id="plusNode">+</button><button id="restartAttraction">Restart</button></div><div class="control"><label for="attractRadius">Sphere radius</label><span class="value" id="attractRadiusValue">1</span></div><input type="range" id="attractRadius" min="0.3" max="1.5" step="0.05" value="1"><div class="control"><label for="mutualStrength">Mutual attraction</label><span class="value" id="mutualStrengthValue">0.12</span></div><input type="range" id="mutualStrength" min="0" max="2" step="0.02" value="0.12"><div class="control"><label for="minSpacing">Minimum spacing</label><span class="value" id="minSpacingValue">1.7</span></div><input type="range" id="minSpacing" min="0.02" max="3" step="0.01" value="1.7"><div class="control"><label for="repulsion">Repulsion strength</label><span class="value" id="repulsionValue">8</span></div><input type="range" id="repulsion" min="0" max="100" step="1" value="8"><div class="control"><label for="damping">Damping</label><span class="value" id="dampingValue">2.2</span></div><input type="range" id="damping" min="0" max="8" step="0.1" value="2.2"><div class="control"><label for="spinX">Physical spin X (°/s)</label><span class="value" id="spinXValue">0</span></div><input type="range" id="spinX" min="-1440" max="1440" step="1" value="0"><div class="control"><label for="spinY">Physical spin Y (°/s)</label><span class="value" id="spinYValue">0</span></div><input type="range" id="spinY" min="-1440" max="1440" step="1" value="0"><div class="control"><label for="spinZ">Physical spin Z (°/s)</label><span class="value" id="spinZValue">0</span></div><input type="range" id="spinZ" min="-1440" max="1440" step="1" value="0"><label><input type="checkbox" id="connections"> Show neighbors</label><div id="energy" class="sub"></div></details><details open><summary>Particle appearance</summary><div class="control"><label>Rendering</label><select id="particleMode"><option value="balls">Shaded balls</option><option value="points">Points</option><option value="image">Imported image</option></select></div><label>Sprite image <input id="spriteFile" type="file" accept="image/*" style="max-width:100%"></label><div class="control"><label>Ball color</label><input type="color" id="ballColor" value="#65baff"></div><div class="control"><label for="ballSize">Ball diameter (% view)</label><span class="value" id="ballSizeValue">5</span></div><input type="range" id="ballSize" min="0.5" max="20" step="0.5" value="5"><div class="control"><label for="lightAz">Light azimuth</label><span class="value" id="lightAzValue">-45</span></div><input type="range" id="lightAz" min="-180" max="180" step="1" value="-45"><div class="control"><label for="lightEl">Light elevation</label><span class="value" id="lightElValue">45</span></div><input type="range" id="lightEl" min="-90" max="90" step="1" value="45"><div class="control"><label for="ambient">Ambient</label><span class="value" id="ambientValue">0.25</span></div><input type="range" id="ambient" min="0" max="1" step="0.05" value="0.25"><div class="control"><label for="shine">Highlight</label><span class="value" id="shineValue">0.6</span></div><input type="range" id="shine" min="0" max="1" step="0.05" value="0.6"><div class="control"><label for="gloss">Shininess</label><span class="value" id="glossValue">24</span></div><input type="range" id="gloss" min="2" max="100" step="1" value="24"></details><div class="control"><label for="animatePoints">Vary positions over time</label><input id="animatePoints" type="checkbox" style="width:20px;height:20px;accent-color:#65cfff"></div>
<div class="control"><label for="waveAmplitude">Wave height</label><span class="value" id="waveAmplitudeValue">0.35</span></div><input id="waveAmplitude" type="range" min="0" max="1.5" step="0.05" value="0.35">
<div class="control"><label for="waveFrequency">Wave frequency</label><span class="value" id="waveFrequencyValue">3.0</span></div><input id="waveFrequency" type="range" min="0.5" max="10" step="0.1" value="3">
<div class="control"><label for="waveSpeed">Wave speed</label><span class="value" id="waveSpeedValue">1.0</span></div><input id="waveSpeed" type="range" min="0" max="5" step="0.1" value="1">
<div class="control"><label for="count">Points</label><span class="value" id="countValue"></span></div><input id="count" type="range" min="200" max="5000" step="100" value="1800">
<div class="control"><label for="speed">Rotation speed</label><span class="value" id="speedValue"></span></div><input id="speed" type="range" min="-120" max="120" step="1" value="25">
<div class="control"><label for="perspective">Perspective</label><span class="value" id="perspectiveValue"></span></div><input id="perspective" type="range" min="2" max="10" step="0.1" value="4.5">
<div class="control"><label for="camera">Camera forward / back</label><span class="value" id="cameraValue"></span></div><input id="camera" type="range" min="-16" max="16" step="0.01" value="0">
<div class="control"><label for="startDepth">Start depth</label><input id="startDepth" type="number" min="-16" max="16" step="0.1" value="-16"></div>
<div class="control"><label for="endDepth">End depth</label><input id="endDepth" type="number" min="-16" max="16" step="0.1" value="16"></div>
<div class="control"><label for="flySpeed">Fly speed</label><span class="value" id="flySpeedValue"></span></div><input id="flySpeed" type="range" min="-1.5" max="1.5" step="0.05" value="0">
<div class="control"><label for="size">Point size</label><span class="value" id="sizeValue"></span></div><input id="size" type="range" min="0.5" max="4" step="0.1" value="1.7">
<div class="control"><label for="format">YouTube video size</label><select id="format"><option value="shorts">Shorts · 1080 × 1920</option><option value="landscape">Standard · 1920 × 1080</option></select></div>
<div class="control"><label for="duration">Video duration (seconds)</label><input id="duration" type="number" min="1" max="600" step="1" value="10"></div>
<div class="preset-section"><h2>Saved settings &amp; presets</h2>
<label for="presetName">Preset name</label><input class="preset-name" id="presetName" type="text" maxlength="60" placeholder="e.g. Waving Ocean" autocomplete="off">
<div class="buttons"><button id="savePreset">Save preset</button></div>
<div class="control"><label for="presetSelect">Load preset</label></div><select id="presetSelect"><option value="">Choose a saved preset…</option></select>
<div class="buttons"><button id="loadPreset">Load</button><button id="deletePreset">Delete</button></div>
<div class="buttons"><button id="exportPresets">Export JSON</button><button id="importPresets">Import JSON</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
<div class="status" id="presetStatus" role="status" aria-live="polite">Settings save automatically on this device.</div></div>
<div class="buttons"><button id="toggle">Pause</button><button id="reset">Reset view</button><button id="regenerate">New cloud</button><button id="export">Export MP4</button><button id="exportWebm">Export WebM</button></div><div class="status" id="exportStatus" role="status" aria-live="polite"></div></div>
<div class="hint">Tap to hide/show controls · Drag to orbit · Scroll to zoom · Camera + = forward</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const controls={};for(const id of ['count','speed','perspective','size','camera','flySpeed']){controls[id]=document.getElementById(id);const output=document.getElementById(id+'Value');const update=()=>output.textContent=id==='speed'?controls[id].value+'°/s':id==='count'?Number(controls[id].value).toLocaleString():id==='camera'||id==='flySpeed'?Number(controls[id].value).toFixed(2):controls[id].value;controls[id].addEventListener('input',update);update()}
const startDepthInput=document.getElementById('startDepth'),endDepthInput=document.getElementById('endDepth');
function getDepthBounds(){
 const a=Math.max(-16,Math.min(16,Number(startDepthInput.value))),b=Math.max(-16,Math.min(16,Number(endDepthInput.value)));
 return [Number.isFinite(a)?a:-16,Number.isFinite(b)?b:16];
}
function updateDepthBounds(changed){
 let [a,b]=getDepthBounds();
 if(a>b){if(changed==='start')b=a;else a=b;}
 startDepthInput.value=a;endDepthInput.value=b;
 cameraPosition=Math.max(a,Math.min(b,cameraPosition));
 controls.camera.value=cameraPosition.toFixed(2);
 document.getElementById('cameraValue').textContent=cameraPosition.toFixed(2);
}
startDepthInput.addEventListener('change',()=>updateDepthBounds('start'));
endDepthInput.addEventListener('change',()=>updateDepthBounds('end'));
const structureInput=document.getElementById('structure'),animatePointsInput=document.getElementById('animatePoints');
for(const id of ['waveAmplitude','waveFrequency','waveSpeed']){const el=document.getElementById(id),out=document.getElementById(id+'Value');el.addEventListener('input',()=>out.textContent=Number(el.value).toFixed(id==='waveAmplitude'?2:1))}
let waveTime=0, physicsAccumulator=0, initialParticles=[];
const physicsIds=['attractRadius', 'mutualStrength', 'minSpacing', 'repulsion', 'damping', 'spinX', 'spinY', 'spinZ', 'ballSize', 'lightAz', 'lightEl', 'ambient', 'shine', 'gloss'];
const el=id=>document.getElementById(id),physicsValue=id=>+el(id).value;
for(const id of physicsIds)el(id).addEventListener('input',()=>el(id+'Value').textContent=el(id).value);
let sprite=null, spriteKey='', ballSprite=null;
el('spriteFile').onchange=()=>{const f=el('spriteFile').files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{sprite=im;el('particleMode').value='image';URL.revokeObjectURL(u);};im.onerror=()=>{URL.revokeObjectURL(u);alert('Could not read image');};im.src=u;};
function newNode(){const y=Math.random()*2-1,a=Math.random()*Math.PI*2,r=physicsValue('attractRadius'),q=Math.sqrt(1-y*y);return {x:r*q*Math.cos(a),y:r*y,z:r*q*Math.sin(a),h:Math.random(),vx:0,vy:0,vz:0};}
function resizeNodes(n){n=Math.max(2,Math.min(800,Math.round(n)||2));while(points.length<n)points.push(newNode());points.length=n;el('nodes').value=n;initialParticles=points.map(p=>({...p}));}
el('nodes').onchange=()=>resizeNodes(+el('nodes').value);el('plusNode').onclick=()=>resizeNodes(points.length+1);el('minusNode').onclick=()=>resizeNodes(points.length-1);
function restartAttraction(){makeCloud();}
el('restartAttraction').onclick=restartAttraction;
function physicsStep(dt){
 const n=points.length,R=physicsValue('attractRadius'),g=physicsValue('mutualStrength'),d=physicsValue('minSpacing'),rep=physicsValue('repulsion'),drag=Math.exp(-physicsValue('damping')*dt),wx=physicsValue('spinX')*Math.PI/180,wy=physicsValue('spinY')*Math.PI/180,wz=physicsValue('spinZ')*Math.PI/180;
 for(const p of points){p.ax=p.ay=p.az=0;}
 for(let i=0;i<n;i++){const a=points[i];for(let j=i+1;j<n;j++){const b=points[j],x=b.x-a.x,y=b.y-a.y,z=b.z-a.z,r=Math.hypot(x,y,z)||1e-8;const f=(r<d?-rep*(d-r):g*(1-d/r)/(r*r+d*d))/r; a.ax+=f*x;a.ay+=f*y;a.az+=f*z;b.ax-=f*x;b.ay-=f*y;b.az-=f*z;}}
 let energy=0;for(const p of points){const dot=wx*p.x+wy*p.y+wz*p.z,ww=wx*wx+wy*wy+wz*wz; // centrifugal acceleration in rotating frame
 p.vx=(p.vx+(p.ax+ww*p.x-wx*dot+2*(wz*p.vy-wy*p.vz))*dt)*drag;p.vy=(p.vy+(p.ay+ww*p.y-wy*dot+2*(wx*p.vz-wz*p.vx))*dt)*drag;p.vz=(p.vz+(p.az+ww*p.z-wz*dot+2*(wy*p.vx-wx*p.vy))*dt)*drag;
 p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const r=Math.hypot(p.x,p.y,p.z)||1e-8;p.x*=R/r;p.y*=R/r;p.z*=R/r;const radial=(p.x*p.vx+p.y*p.vy+p.z*p.vz)/(R*R);p.vx-=radial*p.x;p.vy-=radial*p.y;p.vz-=radial*p.z;energy+=(p.vx*p.vx+p.vy*p.vy+p.vz*p.vz)/2;}
 el('energy').textContent='Kinetic energy: '+energy.toFixed(4);
}
function shadedSprite(){const key=['ballColor','lightAz','lightEl','ambient','shine','gloss'].map(i=>el(i).value).join('|');if(key===spriteKey)return ballSprite;spriteKey=key;const c=document.createElement('canvas');c.width=c.height=96;const ctx=c.getContext('2d'),im=ctx.createImageData(96,96),rgb=el('ballColor').value.match(/\w\w/g).map(x=>parseInt(x,16)),a=physicsValue('lightAz')*Math.PI/180,e=physicsValue('lightEl')*Math.PI/180,lx=Math.sin(a)*Math.cos(e),ly=-Math.sin(e),lz=Math.cos(a)*Math.cos(e),amb=physicsValue('ambient'),sh=physicsValue('shine'),gl=physicsValue('gloss');for(let y=0;y<96;y++)for(let x=0;x<96;x++){const nx=(x-47.5)/47,ny=(y-47.5)/47,q=nx*nx+ny*ny;if(q>1)continue;const nz=Math.sqrt(1-q),dot=nx*lx+ny*ly+nz*lz,d=amb+(1-amb)*Math.max(0,dot),spec=sh*Math.pow(Math.max(0,2*dot*nz-lz),gl),i=(y*96+x)*4;for(let k=0;k<3;k++)im.data[i+k]=Math.min(255,rgb[k]*d+255*spec);im.data[i+3]=Math.min(255,(1-Math.sqrt(q))*47*255);}ctx.putImageData(im,0,0);return ballSprite=c;}
let points=[],yaw=0,pitch=-0.18,zoom=1,paused=false,width=0,height=0,dpr=1,last=0,cameraPosition=0;
function makeCloud(){
 points=[];physicsAccumulator=0;const active=structureInput.value==='attraction';document.getElementById('attractionPanel').hidden=!active;const n=active?Math.min(800,+controls.count.value):+controls.count.value;
 document.getElementById('countValue').textContent=n.toLocaleString();
 if(active){resizeNodes(+el('nodes').value);return;}
 if(structureInput.value==='grid'){
   const side=Math.max(2,Math.round(Math.sqrt(n)));
   for(let iz=0;iz<side;iz++)for(let ix=0;ix<side;ix++){
     const x=(ix/(side-1)*2-1),z=(iz/(side-1)*2-1);
     points.push({x,y:0,z,h:(ix+iz)/(2*(side-1))});
   }
 }else{
   for(let i=0;i<n;i++){
     const y=Math.random()*2-1,a=Math.random()*Math.PI*2,r=structureInput.value==='shell'?1:Math.cbrt(Math.random());
     const s=Math.sqrt(1-y*y);
     points.push({x:r*s*Math.cos(a),y:r*y,z:r*s*Math.sin(a),h:Math.random()});
   }
 }
}
structureInput.addEventListener('change',makeCloud);
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
let recordingCanvas=null,recordingContext=null;
function drawScene(target,w,h){
target.fillStyle='#080d18';target.fillRect(0,0,w,h);
const radius=Math.min(w*.38,h*.40)*zoom,dist=Number(controls.perspective.value),base=radius*dist*.85;
const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
const projected=[];
for(const p of points){
 let py=p.y;
 if(animatePointsInput.checked && structureInput.value!=='attraction'){
   const amp=+document.getElementById('waveAmplitude').value;
   const freq=+document.getElementById('waveFrequency').value;
   if(structureInput.value==='grid')py+=amp*Math.sin(freq*p.x-waveTime)*Math.cos(freq*p.z-waveTime*.7);
   else py+=amp*.28*Math.sin(freq*(p.x+p.z)+waveTime+p.h*3);
 }
 const x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy;const y=py*cp-z*sp,depth=py*sp+z*cp;const distanceToPoint=dist-depth-cameraPosition;if(distanceToPoint<=0.08)continue;const scale=dist/distanceToPoint;projected.push({source:p,x:w/2+x*base*scale/dist,y:h/2+y*base*scale/dist,depth,scale,h:p.h})}
projected.sort((a,b)=>a.depth-b.depth);
if(structureInput.value==='attraction'&&el('connections').checked){target.strokeStyle='rgba(160,210,255,.35)';target.lineWidth=1;for(let i=0;i<projected.length;i++)for(let j=i+1;j<projected.length;j++){const a=projected[i],b=projected[j],p=a.source,q=b.source;if(Math.hypot(p.x-q.x,p.y-q.y,p.z-q.z)>physicsValue('minSpacing')*1.05)continue;target.beginPath();target.moveTo(a.x,a.y);target.lineTo(b.x,b.y);target.stroke();}}
const mode=el('particleMode').value,im=mode==='image'&&sprite?sprite:mode!=='points'?shadedSprite():null;
for(const p of projected){if(im){const d=Math.min(w,h)*physicsValue('ballSize')/100*p.scale;const ratio=im.width/im.height;const iw=d*Math.min(1,ratio),ih=d*Math.min(1,1/ratio);target.drawImage(im,p.x-iw/2,p.y-ih/2,iw,ih);continue;}const r=Math.max(.3,+controls.size.value*p.scale);target.beginPath();target.arc(p.x,p.y,r,0,Math.PI*2);target.fillStyle='#aaddff';target.fill();}
}
function render(t){const dt=Math.min((t-last)/1000||0,0.05);last=t;if(!paused){if(structureInput.value==='attraction'){physicsAccumulator+=dt;while(physicsAccumulator>=1/60){physicsStep(1/60);physicsAccumulator-=1/60;}}waveTime+=dt*Number(document.getElementById('waveSpeed').value);yaw+=Number(controls.speed.value)*Math.PI/180*dt;
const fly=Number(controls.flySpeed.value);if(fly!==0){
// Smoothly decelerate as the camera approaches the selected endpoint.
const [startDepth,endDepth]=getDepthBounds();
const limit=fly>0?endDepth:startDepth,remaining=Math.abs(limit-cameraPosition);
const u=Math.max(0,Math.min(1,remaining/Math.min(1.5,Math.max(0.1,(endDepth-startDepth)/2))));
const ease=u*u*(3-2*u);
const step=Math.abs(fly)*dt*ease;
cameraPosition=Math.max(startDepth,Math.min(endDepth,cameraPosition+Math.sign(fly)*step));
if(remaining<0.005)cameraPosition=limit;
document.getElementById('cameraValue').textContent=Number(controls.camera.value).toFixed(2)}}
drawScene(ctx,width,height);
if(recordingCanvas)drawScene(recordingContext,recordingCanvas.width,recordingCanvas.height);
requestAnimationFrame(render)}
let dragging=false,px=0,py=0,startX=0,startY=0,moved=false;
const panel=document.getElementById('panel');
function togglePanel(){panel.classList.toggle('hidden')}
controls.camera.addEventListener('input',()=>{cameraPosition=Number(controls.camera.value)});
canvas.addEventListener('pointerdown',e=>{dragging=true;px=startX=e.clientX;py=startY=e.clientY;moved=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)moved=true;if(!moved){px=e.clientX;py=e.clientY;return}yaw+=(e.clientX-px)*.007;pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+(e.clientY-py)*.007));px=e.clientX;py=e.clientY});
canvas.addEventListener('pointerup',e=>{if(dragging&&!moved&&Math.hypot(e.clientX-startX,e.clientY-startY)<=8)togglePanel();dragging=false});canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(2.8,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
function toggle(){paused=!paused;document.getElementById('toggle').textContent=paused?'Resume':'Pause'}
document.getElementById('toggle').onclick=toggle;
document.getElementById('reset').onclick=()=>{yaw=0;pitch=-.18;zoom=1;cameraPosition=0;controls.camera.value='0';document.getElementById('cameraValue').textContent='0.00';controls.flySpeed.value='0';document.getElementById('flySpeedValue').textContent='0.00';startDepthInput.value='-16';endDepthInput.value='16'};
document.getElementById('regenerate').onclick=makeCloud;controls.count.addEventListener('change',makeCloud);
const exportButton=document.getElementById('export'),webmButton=document.getElementById('exportWebm'),exportStatus=document.getElementById('exportStatus'),durationInput=document.getElementById('duration'),formatInput=document.getElementById('format');
let recording=false;
function recordVideo(format){
  if(recording)return;
  const duration=Math.round(Number(durationInput.value));
  if(!Number.isFinite(duration)||duration<1||duration>600){exportStatus.textContent='Enter a duration between 1 and 600 seconds.';return}
  durationInput.value=duration;
  if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){exportStatus.textContent='Video recording is not supported in this browser.';return}
  const candidates=format==='mp4'
    ?['video/mp4;codecs="avc1.42E01E"','video/mp4;codecs=avc1','video/mp4']
    :['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=candidates.find(type=>MediaRecorder.isTypeSupported(type));
  if(!mime){exportStatus.textContent=format==='mp4'?'This browser cannot record MP4 directly. Try the WebM button, or open this page in a browser with MP4 recording support.':'WebM recording is not supported in this browser.';return}
  const videoSize=formatInput.value==='landscape'?{w:1920,h:1080,name:'standard'}:{w:1080,h:1920,name:'shorts'};
  recordingCanvas=document.createElement('canvas');recordingCanvas.width=videoSize.w;recordingCanvas.height=videoSize.h;
  recordingContext=recordingCanvas.getContext('2d',{alpha:false});
  cameraPosition=Number(controls.camera.value);
  if(structureInput.value==='attraction'){points=initialParticles.map(p=>({...p}));physicsAccumulator=0;}
  drawScene(recordingContext,videoSize.w,videoSize.h);
  const stream=recordingCanvas.captureStream(30),chunks=[];
  let recorder;
  try{recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000})}
  catch(err){stream.getTracks().forEach(track=>track.stop());recordingCanvas=recordingContext=null;exportStatus.textContent='Could not start recording: '+err.message;return}
  const wasPaused=paused;
  if(paused){paused=false;document.getElementById('toggle').textContent='Pause'}
  recording=true;exportButton.disabled=webmButton.disabled=durationInput.disabled=formatInput.disabled=true;
  exportButton.textContent=format==='mp4'?'Recording MP4…':'Export MP4';
  webmButton.textContent=format==='webm'?'Recording WebM…':'Export WebM';
  exportStatus.textContent=`Recording ${duration} seconds…`;
  let stopTimer,failed=false;
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onerror=()=>{failed=true;exportStatus.textContent='Recording failed.'};
  recorder.onstop=()=>{
    clearTimeout(stopTimer);stream.getTracks().forEach(track=>track.stop());recordingCanvas=recordingContext=null;
    if(wasPaused){paused=true;document.getElementById('toggle').textContent='Resume'}
    recording=false;exportButton.disabled=webmButton.disabled=durationInput.disabled=formatInput.disabled=false;
    exportButton.textContent='Export MP4';webmButton.textContent='Export WebM';
    if(failed)return;
    if(!chunks.length){exportStatus.textContent='No video data was captured.';return}
    const extension=format==='mp4'?'mp4':'webm';
    const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=`rotating-point-cloud-${videoSize.name}-${videoSize.w}x${videoSize.h}-${duration}s.`+extension;
    document.body.appendChild(link);link.click();link.remove();
    exportStatus.textContent='Video saved as '+extension.toUpperCase()+'.';
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  try{recorder.start(100);stopTimer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},duration*1000)}
  catch(err){stream.getTracks().forEach(track=>track.stop());if(wasPaused){paused=true;document.getElementById('toggle').textContent='Resume'}recording=false;exportButton.disabled=webmButton.disabled=durationInput.disabled=formatInput.disabled=false;exportButton.textContent='Export MP4';webmButton.textContent='Export WebM';recordingCanvas=recordingContext=null;exportStatus.textContent='Recording failed: '+err.message}
}
exportButton.addEventListener('click',()=>recordVideo('mp4'));
webmButton.addEventListener('click',()=>recordVideo('webm'));
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}});
// Persist the editable configuration on this device; never upload it to a server.
const SETTINGS_KEY='point-cloud-settings-v1',PRESETS_KEY='point-cloud-presets-v1';
const settingIds=['structure','animatePoints','waveAmplitude','waveFrequency','waveSpeed','count','speed','perspective','camera','startDepth','endDepth','flySpeed','size','format','duration',...physicsIds,'nodes','connections','particleMode','ballColor'];
const presetName=document.getElementById('presetName'),presetSelect=document.getElementById('presetSelect'),presetStatus=document.getElementById('presetStatus');
const storedValue=id=>{const el=document.getElementById(id);return el.type==='checkbox'?el.checked:el.value};
function snapshot(){const values={};for(const id of settingIds)values[id]=storedValue(id);values.camera=Number(controls.camera.value);return {...values,yaw,pitch,zoom,paused};}
function safeParse(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value&&typeof value==='object'&&!Array.isArray(value)?value:fallback}catch{return fallback}}
let presets=safeParse(PRESETS_KEY,{}),savingSuspended=false,saveTimer=null;
function saveCurrent(){if(savingSuspended)return;try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(snapshot()))}catch{presetStatus.textContent='Could not save settings: browser storage is unavailable.'}}
function scheduleSave(){if(savingSuspended)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,250)}
function restore(settings){
 if(!settings||typeof settings!=='object')return;
 savingSuspended=true;
 for(const id of settingIds){const el=document.getElementById(id),value=settings[id];if(value===undefined||value===null)continue;
  if(el.type==='checkbox'){el.checked=value===true;continue}
  if(el.type==='range'||el.type==='number'){
   const n=Number(value);if(!Number.isFinite(n))continue;
   el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),n)));
  }else if(el.type==='color'){if(/^#[0-9a-f]{6}$/i.test(value))el.value=value;}else if(el.tagName==='SELECT'){if([...el.options].some(o=>o.value===value))el.value=value}
 }
 updateDepthBounds('start');
 const [a,b]=getDepthBounds();cameraPosition=Math.max(a,Math.min(b,Number(controls.camera.value)));
 controls.camera.value=cameraPosition.toFixed(2);
 for(const id of ['count','speed','perspective','size','camera','flySpeed','waveAmplitude','waveFrequency','waveSpeed',...physicsIds])document.getElementById(id).dispatchEvent(new Event('input'));
 if(Number.isFinite(settings.yaw))yaw=settings.yaw;
 if(Number.isFinite(settings.pitch))pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,settings.pitch));
 if(Number.isFinite(settings.zoom))zoom=Math.max(.35,Math.min(2.8,settings.zoom));
 if(typeof settings.paused==='boolean'){paused=settings.paused;document.getElementById('toggle').textContent=paused?'Resume':'Pause'}
 makeCloud();savingSuspended=false;saveCurrent();
}
function refreshPresets(selected=''){
 presetSelect.replaceChildren(new Option('Choose a saved preset…',''));
 for(const name of Object.keys(presets).sort((a,b)=>a.localeCompare(b)))presetSelect.add(new Option(name,name));
 if(selected&&Object.hasOwn(presets,selected))presetSelect.value=selected;
}
function savePresets(){try{localStorage.setItem(PRESETS_KEY,JSON.stringify(presets));return true}catch{presetStatus.textContent='Unable to save presets on this device.';return false}}
document.getElementById('savePreset').onclick=()=>{
 const name=presetName.value.trim();if(!name){presetStatus.textContent='Enter a name for this preset.';return}
 if(Object.hasOwn(presets,name)&&!confirm('Replace preset "'+name+'"?'))return;
 presets[name]=snapshot();if(savePresets()){refreshPresets(name);presetStatus.textContent='Saved preset: '+name}
};
document.getElementById('loadPreset').onclick=()=>{
 const name=presetSelect.value;if(!name||!Object.hasOwn(presets,name)){presetStatus.textContent='Select a preset first.';return}
 restore(presets[name]);presetName.value=name;presetStatus.textContent='Loaded preset: '+name;
};
document.getElementById('deletePreset').onclick=()=>{
 const name=presetSelect.value;if(!name||!Object.hasOwn(presets,name)){presetStatus.textContent='Select a preset to delete.';return}
 if(!confirm('Delete preset "'+name+'"?'))return;
 delete presets[name];savePresets();refreshPresets();presetStatus.textContent='Deleted preset: '+name;
};
document.getElementById('exportPresets').onclick=()=>{
 const blob=new Blob([JSON.stringify({app:'point-cloud',version:1,settings:snapshot(),presets},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='point-cloud-presets.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);presetStatus.textContent='Exported settings and presets.';
};
document.getElementById('importPresets').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{if(file.size>1000000)throw Error('File too large');const data=JSON.parse(await file.text());
 if(data.app!=='point-cloud'||data.version!==1||!data.presets||typeof data.presets!=='object'||Array.isArray(data.presets))throw Error('Not a Point Cloud preset backup');
 const imported=Object.entries(data.presets).filter(([name,val])=>name.length<=60&&val&&typeof val==='object'&&!Array.isArray(val));
 const conflicts=imported.filter(([name])=>Object.hasOwn(presets,name));
 if(conflicts.length&&!confirm(conflicts.length+' preset name(s) already exist. Replace those presets?')){presetStatus.textContent='Import canceled.';return}
 for(const [name,val] of imported)presets[name]=val;
 if(!savePresets())return;refreshPresets();presetStatus.textContent='Imported '+imported.length+' presets. Current settings unchanged.';
 }catch(err){presetStatus.textContent='Import failed: '+err.message}finally{e.target.value=''}
});
for(const id of settingIds){const el=document.getElementById(id);el.addEventListener('input',scheduleSave);el.addEventListener('change',scheduleSave)}
for(const id of ['toggle','reset','regenerate'])document.getElementById(id).addEventListener('click',scheduleSave);
canvas.addEventListener('pointerup',scheduleSave);canvas.addEventListener('wheel',scheduleSave);
window.addEventListener('pagehide',saveCurrent);
// Moving camera values are saved periodically without writing on every animation frame.
let lastAutosave=0;setInterval(()=>{if(!savingSuspended&&!recording)saveCurrent()},5000);
window.addEventListener('resize',resize);resize();refreshPresets();restore(safeParse(SETTINGS_KEY,{}));makeCloud();requestAnimationFrame(render);
})();
</script>
